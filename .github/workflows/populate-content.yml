# .github/workflows/populate-content.yml

name: Nura Content Pipeline

on:
  workflow_dispatch:             # manual trigger from GitHub UI
    inputs:
      batch_size:
        description: "Recipes to process (0 = all pending)"
        required: false
        default: "50"
      step:
        description: "Run single step only (scrape/insert/vectorize/images/link) or leave blank for all"
        required: false
        default: ""
  schedule:
    # Runs every Monday at 08:00 UTC — picks up any new recipes added to the Doc
    - cron: "0 8 * * 1"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90           # generous limit for 150 recipes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Restore pipeline state from cache so re-runs skip completed steps
      - name: Restore pipeline state
        uses: actions/cache@v4
        with:
          path: scripts/output
          key: pipeline-state-${{ github.run_id }}
          restore-keys: pipeline-state-

      # Service account JSON from GitHub secret
      - name: Write service account key
        run: |
          mkdir -p scripts
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > scripts/service-account.json

      - name: Run pipeline
        env:
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          BATCH=${{ github.event.inputs.batch_size || '0' }}
          STEP=${{ github.event.inputs.step || '' }}
          
          CMD="npx tsx scripts/run-pipeline.ts"
          [ "$BATCH" != "0" ] && CMD="$CMD --batch=$BATCH"
          [ -n "$STEP" ] && CMD="$CMD --step=$STEP"
          
          $CMD

      - name: Upload outputs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_id }}
          path: scripts/output/
          retention-days: 30
